<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Victor Combat, ingénieur R&D Vision et Robotique à Lyon."
    />
    <meta name="theme-color" content="#121014" />
    <title>Victor Combat — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="icon" href="assets/images/photo_victor_1000x1000.jpg" type="image/jpeg" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="#about">Victor <span>Combat</span></a>

        <button
          class="nav-toggle"
          type="button"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="nav" id="site-nav" data-nav aria-label="Primary">
          <ul class="nav__list" data-nav-list></ul>
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-switch__btn" data-lang="fr" aria-pressed="false">
              FR
            </button>
            <button type="button" class="lang-switch__btn" data-lang="en" aria-pressed="false">
              EN
            </button>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <p class="container" data-app-error hidden style="padding: 2rem 0; color: var(--color-danger)"></p>

      <section class="hero" id="about" data-hero aria-label="About"></section>

      <section class="section" id="skills">
        <div class="container" data-skills></div>
      </section>

      <section class="section" id="education">
        <div class="container" data-education></div>
      </section>

      <section class="section" id="experience">
        <div class="container" data-experience></div>
      </section>

      <section class="section" id="certifications">
        <div class="container" data-certifications></div>
      </section>

      <section class="section" id="projects">
        <div class="container" data-projects></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p data-footer></p>
        <a href="mailto:victor.cmbt@gmail.com">victor.cmbt@gmail.com</a>
      </div>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
